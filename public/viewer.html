<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NOEMATA // SPATIAL AR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <button id="btn-enter-ar" class="btn-enter-ar">LAUNCH AR EXPERIENCE</button>

    <div id="viewer-hud" class="hud-overlay" style="display: none;">
        <div class="status-pill" id="sync-status">VPS SEARCHING... POINT AT ENTRANCE/DESKS</div>
        <div class="btn-bar">
            <button class="btn" id="btn-manual-vps">FORCE VPS SCAN</button>
        </div>
    </div>

    <script>
        // Update this URL with your active ngrok tunnel URL
        const VPS_ENDPOINT = "https://battle-freeway-quadrant.ngrok-free.dev";

        AFRAME.registerComponent('billboard', {
            tick: function () {
                const cam = document.getElementById('main-camera');
                if (!cam) return;
                const nodePos = this.el.object3D.position;
                const camPos = cam.object3D.position;
                this.el.object3D.rotation.y = Math.atan2(camPos.x - nodePos.x, camPos.z - nodePos.z);
            }
        });

        AFRAME.registerComponent('vps-client-manager', {
            init: function () {
                this.lastScan = 0;
                this.isLocked = false;
            },
            tick: function (time) {
                // Auto-poll VPS every 3 seconds until locked
                if (!this.isLocked && time - this.lastScan > 3000) {
                    this.lastScan = time;
                    this.triggerVPSCapture();
                }
            },
            triggerVPSCapture: async function () {
                const scene = this.el.sceneEl;
                if (!scene.is('ar-mode')) return;

                const renderer = scene.renderer;
                const camera = scene.camera;
                const canvas = renderer.domElement;
                const statusPill = document.getElementById('sync-status');

                // Extract lightweight WebGL frame
                const base64Image = canvas.toDataURL('image/jpeg', 0.55).split(',')[1];
                const p = camera.projectionMatrix.elements;
                const w = canvas.width;
                const h = canvas.height;

                const payload = {
                    image_b64: base64Image,
                    fx: (p[0] * w) / 2,
                    fy: (p[5] * h) / 2,
                    ox: w / 2,
                    oy: h / 2
                };

                try {
                    const res = await fetch(VPS_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();

                    if (data.success && data.matrix) {
                        this.isLocked = true;
                        const vpsMatrix = new THREE.Matrix4().fromArray(data.matrix);
                        const container = document.getElementById('datum-container');
                        
                        container.object3D.matrixAutoUpdate = false;
                        container.object3D.matrix.copy(camera.matrixWorld).multiply(vpsMatrix.invert());

                        statusPill.innerText = `VPS LOCKED (INLIERS: ${data.inliers}) ● SYNCED`;
                        statusPill.classList.add('status-locked');
                    }
                } catch (e) {
                    console.warn("VPS Query Notice:", e.message);
                }
            }
        });
    </script>

    <a-scene webxr="optionalFeatures: hit-test, local-floor, dom-overlay; overlayElement: #viewer-hud; referenceSpaceType: local-floor;"
             vps-client-manager
             renderer="alpha: true; antialias: true;"
             xr-mode-ui="enabled: false">

        <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>
        <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
        <a-entity id="datum-container" position="0 0 0"></a-entity>
    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'] });

        function renderAnchors(anchors) {
            const container = document.getElementById('datum-container');
            container.innerHTML = '';

            Object.entries(anchors).forEach(([key, data]) => {
                const node = document.createElement('a-entity');
                node.setAttribute('id', key);
                node.setAttribute('billboard', '');
                node.setAttribute('position', `${data.x} ${data.y} ${data.z}`);

                const box = document.createElement('a-box');
                box.setAttribute('width', '0.18');
                box.setAttribute('height', '0.18');
                box.setAttribute('depth', '0.18');
                box.setAttribute('material', 'color: #00f0ff; wireframe: true;');
                node.appendChild(box);

                const label = document.createElement('a-text');
                label.setAttribute('value', data.label || key.toUpperCase());
                label.setAttribute('position', '0 0.22 0');
                label.setAttribute('align', 'center');
                label.setAttribute('width', '1.6');
                label.setAttribute('color', '#00f0ff');
                node.appendChild(label);

                const card = document.createElement('a-entity');
                card.setAttribute('position', '0 0.48 0');
                card.innerHTML = `
                    <a-plane width="0.85" height="0.32" color="#0d1117" opacity="0.92" material="shader: flat;"></a-plane>
                    <a-text value="${data.label || key.toUpperCase()}" color="#34d399" width="1.3" position="-0.38 0.08 0.01"></a-text>
                    <a-text value="${data.desc || 'Station Active'}" color="#ffffff" width="1.0" position="-0.38 -0.06 0.01"></a-text>
                `;
                node.appendChild(card);
                container.appendChild(node);
            });
        }

        fetch('/api/spatial/map')
            .then(res => res.json())
            .then(data => renderAnchors(data.anchors || data));

        socket.on('spatialAnchorsUpdated', (data) => renderAnchors(data.anchors || data));

        document.getElementById('btn-manual-vps').addEventListener('click', () => {
            const manager = document.querySelector('a-scene').components['vps-client-manager'];
            if (manager) manager.triggerVPSCapture();
        });

        document.getElementById('btn-enter-ar').addEventListener('click', async () => {
            const scene = document.querySelector('a-scene');
            if (!scene.hasLoaded) {
                await new Promise(r => scene.addEventListener('loaded', r));
            }
            try {
                if (scene.enterAR) await scene.enterAR();
                else await scene.enterVR();
                document.getElementById('viewer-hud').style.display = 'flex';
                document.getElementById('btn-enter-ar').style.display = 'none';
            } catch (e) {
                alert("AR Error: " + e.message);
            }
        });
    </script>
</body>
</html>
