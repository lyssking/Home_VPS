<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebXR 6DOF VPS Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; color: #fff; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 1000; background: rgba(15, 23, 42, 0.88); border-radius: 12px; padding: 12px; font-size: 13px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 6px; }
    .hud-row { display: flex; justify-content: space-between; align-items: center; }
    .status-pill { font-weight: 700; padding: 3px 10px; border-radius: 12px; font-size: 11px; }
    .status-initializing { background: #475569; }
    .status-searching { background: #d97706; } 
    .status-locked { background: #16a34a; } 
    .status-error { background: #dc2626; }
    #ar-button { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 1000; background: #2563eb; color: #fff; border: none; padding: 16px 32px; border-radius: 32px; font-weight: bold; font-size: 16px; }
    #capture-canvas { display: none; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-row"><span><strong>VPS Status:</strong></span><span id="vps-status" class="status-pill status-initializing">READY TO START</span></div>
    <div class="hud-row"><span style="color:#94a3b8;">Endpoint:</span><span id="vps-endpoint-label" style="font-family: monospace; font-size: 11px;">Connecting...</span></div>
    <div class="hud-row"><span style="color:#94a3b8;">Telemetry:</span><span id="vps-telemetry" style="font-family: monospace; font-size: 11px;">Awaiting AR Session</span></div>
  </div>

  <button id="ar-button" onclick="startXRSession()">ENTER 6DOF AR</button>
  <canvas id="capture-canvas"></canvas>

  <script>
    // ==========================================
    // PASTE YOUR NGROK URL HERE:
    // ==========================================
    const NGROK_BASE_URL = " https://battle-freeway-quadrant.ngrok-free.dev";
    const VPS_ENDPOINT = `${NGROK_BASE_URL}/api/vps/localize`;

    document.getElementById("vps-endpoint-label").innerText = NGROK_BASE_URL.replace("https://", "");

    let scene, camera, renderer, xrRefSpace;
    let worldAnchorGroup;
    let isLocalizing = false;
    let hasLocked = false;
    let requestCount = 0;
    let videoStream, hiddenVideo;

    function updateStatus(text, stateClass) {
      const pill = document.getElementById("vps-status");
      if (pill) {
        pill.innerText = text;
        pill.className = `status-pill status-${stateClass}`;
      }
    }

    async function startXRSession() {
      if (!navigator.xr) {
        alert("WebXR is not supported on this browser. Use Chrome on Android.");
        return;
      }

      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        alert("Immersive AR not supported on this device.");
        return;
      }

      document.getElementById('ar-button').style.display = 'none';

      // 1. Setup Three.js with WebXR enabled
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));

      // This group holds all world-locked items (origin, markers, models)
      worldAnchorGroup = new THREE.Group();
      scene.add(worldAnchorGroup);
      createOriginMarker();

      // 2. Start background camera feed for sending VPS frames
      hiddenVideo = document.createElement('video');
      hiddenVideo.setAttribute('autoplay', '');
      hiddenVideo.setAttribute('muted', '');
      hiddenVideo.setAttribute('playsinline', '');
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 640, height: 360 } });
      hiddenVideo.srcObject = videoStream;
      await hiddenVideo.play();

      // 3. Request ARCore Immersive Session
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local-floor']
      });

      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(session);
      xrRefSpace = await session.requestReferenceSpace('local-floor');

      updateStatus("SEARCHING FOR LOCK", "searching");
      setInterval(captureAndLocalize, 1200);

      renderer.setAnimationLoop(render);
    }

    function createOriginMarker() {
      const origin = new THREE.Group();
      
      // Coordinate Axes: Red=X, Green=Y, Blue=Z
      origin.add(new THREE.AxesHelper(0.8));

      // Floor Target Ring
      const ringGeo = new THREE.RingGeometry(0.25, 0.28, 32);
      ringGeo.rotateX(-Math.PI / 2);
      origin.add(new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide })));

      // 3D Origin Box
      const boxGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.8 });
      const boxMesh = new THREE.Mesh(boxGeo, boxMat);
      boxMesh.position.y = 0.06;
      origin.add(boxMesh);

      worldAnchorGroup.add(origin);
    }

    async function captureAndLocalize() {
      if (isLocalizing || !hiddenVideo || hiddenVideo.videoWidth === 0) return;
      isLocalizing = true;
      requestCount++;

      const canvas = document.getElementById('capture-canvas');
      canvas.width = 480;
      canvas.height = 270;
      canvas.getContext('2d').drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);

      try {
        const res = await fetch(VPS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ image: canvas.toDataURL('image/jpeg', 0.65) })
        });

        const data = await res.json();
        document.getElementById("vps-telemetry").innerText = `Resp #${requestCount}: ${data.status || "OK"}`;

        if (data.matched) {
          updateStatus(`LOCKED (${data.inliers} INLIERS)`, "locked");
          calibrateWorldPose(data.pose);
        } else {
          if (!hasLocked) updateStatus(`SEARCHING (${data.inliers || 0} INLIERS)`, "searching");
        }
      } catch (err) {
        document.getElementById("vps-telemetry").innerText = `Network Error`;
      } finally {
        isLocalizing = false;
      }
    }

    function calibrateWorldPose(pose) {
      // 1. Get current ARCore camera position in WebXR tracking space
      const xrCamera = renderer.xr.getCamera(camera);
      const xrCamPos = xrCamera.position;
      const xrCamQuat = xrCamera.quaternion;

      // 2. Compute VPS camera offset
      const vpsCamPos = new THREE.Vector3(pose.position.x, pose.position.y, pose.position.z);
      const vpsEuler = new THREE.Euler(pose.rotation.x, pose.rotation.y, pose.rotation.z, 'XYZ');
      const vpsCamQuat = new THREE.Quaternion().setFromEuler(vpsEuler);

      // 3. Align the world coordinate system so (0,0,0) stays at the physical LiDAR origin
      // World_in_XR = XR_Camera * VPS_Camera_Inverted
      const vpsCamMatrix = new THREE.Matrix4().makeRotationFromQuaternion(vpsCamQuat).setPosition(vpsCamPos);
      const vpsInv = new THREE.Matrix4().copy(vpsCamMatrix).invert();

      const xrCamMatrix = new THREE.Matrix4().makeRotationFromQuaternion(xrCamQuat).setPosition(xrCamPos);
      const targetWorldMatrix = new THREE.Matrix4().multiplyMatrices(xrCamMatrix, vpsInv);

      const targetPos = new THREE.Vector3();
      const targetRot = new THREE.Quaternion();
      const targetScale = new THREE.Vector3();
      targetWorldMatrix.decompose(targetPos, targetRot, targetScale);

      // Snap on first lock, then softly blend subsequent drift corrections
      if (!hasLocked) {
        worldAnchorGroup.position.copy(targetPos);
        worldAnchorGroup.quaternion.copy(targetRot);
        hasLocked = true;
      } else {
        worldAnchorGroup.position.lerp(targetPos, 0.1);
        worldAnchorGroup.quaternion.slerp(targetRot, 0.1);
      }
    }

    function render(timestamp, frame) {
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
